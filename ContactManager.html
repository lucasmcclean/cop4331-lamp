<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <!-- Scripts -->
    <script type="text/javascript" src="js/code.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            readCookie();
            searchContacts();
        }, false);</script>
</head>
<body class="py-4 py-md-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- Header / User Bar -->
                <div class="d-flex flex-column flex-md-row align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary-subtle gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="app-icon-wrapper-sm">
                            <i class="bi bi-person-lines-fill"></i>
                        </div>
                        <h1 id="title" class="h3 fw-bold mb-0">Personal Contacts Manager</h1>
                    </div>

                    <!-- Logged In User Info & Logout Button -->
                    <div id="loggedInDiv" class="d-flex align-items-center gap-3 px-3 py-2 rounded-pill" style="background-color: #f8f1e3; border: 1px solid #d8cdb8;">

                        <span id="userName" class="small fw-medium text-body"></span>
                        <button type="button" id="logoutButton" class="buttons btn btn-outline-danger btn-sm rounded-pill px-3" onclick="doLogout();">
                            <i class="bi bi-box-arrow-right me-1"></i> Log Out
                        </button>
                    </div>
                </div>

                <!-- Access UI Card -->
                <div id="accessUIDiv" class="card glass-card shadow-lg border-0 p-4 p-md-5">
                    <div class="card-body p-0">
                        <h2 class="h5 fw-bold mb-4 d-flex align-items-center gap-2" style="color: #14532d;">
                            <i class="bi bi-person-vcard" style="color: #14532d;"></i> Contact Manager
                        </h2>



                        <!-- Create Contact Section -->
                        <div class="section-card p-4 rounded-4 border mb-4">
                            <label class="form-label form-label-contrast small text-uppercase mb-3">
                                Create New Contact
                            </label>

                            <div class="row g-3">

                                <!-- First Name -->

                                <div class="mb-4">
                                    <label for="firstName" class="form-label form-label-contrast small">First Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-badge text-secondary-contrast"></i></span>
                                        <input type="text" id="firstName" class="form-control" placeholder="Enter first name" required />
                                    </div>
                                </div>




                                <!-- Last Name -->

                                <div class="mb-4">
                                    <label for="lastName" class="form-label form-label-contrast small">Last Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-badge-fill text-secondary-contrast"></i></span>
                                        <input type="text" id="lastName" class="form-control" placeholder="Enter last name" required />
                                    </div>
                                </div>


                                <!-- Phone Number -->

                                <div class="mb-4">
                                    <label for="phoneNum" class="form-label form-label-contrast small">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone text-secondary-contrast"></i></span>
                                        <input type="text" id="phoneNum" class="form-control" placeholder="Enter phone number" required />
                                    </div>
                                </div>


                                <!-- Email Address -->

                                <div class="mb-4">
                                    <label for="emailAdd" class="form-label form-label-contrast small">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope-at text-secondary-contrast"></i></span>
                                        <input type="text" id="emailAdd" class="form-control" placeholder="Enter email" required />
                                    </div>
                                </div>




                                <!-- Add Contact Button -->
                                <div class="col-12">
                                    <button type="button" id="createContactButton" class="buttons btn btn-success px-4 fw-semibold w-100" onclick="addContact();">
                                        <i class="bi bi-person-add me-2"></i>
                                        Add Contact
                                    </button>
                                </div>
                            </div>

                            <div class="mt-3 text-start">
                                <span id="contactAddResult" class="small fw-semibold"></span>
                            </div>
                        </div>





                        <!-- Search Section -->
                        <div class="section-card p-4 rounded-4 border mb-4">
                            <label for="searchValue" class="form-label form-label-contrast small text-uppercase">Search Contacts</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                                <input type="text" id="searchValue" class="form-control" placeholder="Search name, email, phone, or contact ID" onkeyup="if(event.key === 'Enter') searchContacts();" />
                                <button type="button" id="searchContactsButton" class="buttons btn btn-success px-4 fw-semibold" onclick="searchContacts();">
                                    Search Contacts
                                </button>
                            </div>
                            <div class="mt-3">
                                <div id="contactSearchResult" class="mt-2 d-flex flex-wrap gap-2"></div>
                                <span id="contactEditLoaded" class="small fw-semibold d-block"></span>
                                <span id="contactDeleteResult" class="small fw-semibold"></span>
                            </div>
                        </div>



                        <!-- Edit Contact Section -->
                        <div id="editContactSection" class="section-card p-4 rounded-4 border">
                            <label class="form-label form-label-contrast small text-uppercase mb-3">
                                Edit Contact
                            </label>

                            <p class="small mb-3">
                                Choose <strong>Edit</strong> on any contact in the search results to load it
                                here, change any field, then save. The contact ID cannot be changed.
                            </p>

                            <div class="row g-3">

                                <div class="col-md-12">
                                    <label for="editContactId" class="form-label form-label-contrast small">Contact ID (not editable)</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-hash text-secondary-contrast"></i></span>
                                        <input type="text" id="editContactId" class="form-control" placeholder="Select a contact above" readonly />
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="editFirstName" class="form-label form-label-contrast small">First Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-badge text-secondary-contrast"></i></span>
                                        <input type="text" id="editFirstName" class="form-control" placeholder="Enter first name" />
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="editLastName" class="form-label form-label-contrast small">Last Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-badge-fill text-secondary-contrast"></i></span>
                                        <input type="text" id="editLastName" class="form-control" placeholder="Enter last name" />
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="editPhone" class="form-label form-label-contrast small">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone text-secondary-contrast"></i></span>
                                        <input type="text" id="editPhone" class="form-control" placeholder="Enter phone number" />
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label for="editEmail" class="form-label form-label-contrast small">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope-at text-secondary-contrast"></i></span>
                                        <input type="text" id="editEmail" class="form-control" placeholder="Enter email" />
                                    </div>
                                </div>

                                <div class="col-12">
                                    <button type="button" id="saveContactButton" class="buttons btn btn-success px-4 fw-semibold w-100" onclick="updateContact();" disabled>
                                        <i class="bi bi-check-lg me-2"></i>
                                        Save Changes
                                    </button>
                                </div>

                            </div>

                            <div class="mt-3 text-start">
                                <span id="contactUpdateResult" class="small fw-semibold"></span>
                            </div>
                        </div>




                    </div>



                </div>
            </div>

        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

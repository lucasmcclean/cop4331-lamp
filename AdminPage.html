<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <!-- Scripts -->
    <script type="text/javascript" src="js/code.js"></script>
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function () {
            readCookie();
        }, false);</script>
</head>
<body class="py-4 py-md-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <!-- Header / User Bar -->
                <div class="d-flex flex-column flex-md-row align-items-center justify-content-between mb-4 pb-3 border-bottom border-secondary-subtle gap-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="app-icon-wrapper-sm">
                            <i class="bi bi-person-lines-fill"></i>
                        </div>
                        <h1 id="title" class="h3 fw-bold mb-0">Admin User Page</h1>
                    </div>

                    <!-- Logged In User Info & Logout Button -->
                    <div id="loggedInDiv" class="d-flex align-items-center gap-3 px-3 py-2 rounded-pill" style="background-color: #f8f1e3; border: 1px solid #d8cdb8;">

                        <span id="userName" class="small fw-medium text-body"></span>
                        <button type="button" id="logoutButton" class="buttons btn btn-outline-danger btn-sm rounded-pill px-3" onclick="doLogout();">
                            <i class="bi bi-box-arrow-right me-1"></i> Log Out
                        </button>
                    </div>
                </div>

                <!-- Access UI Card -->
                <div id="accessUIDiv" class="card glass-card shadow-lg border-0 p-4 p-md-5">
                    <div class="card-body p-0">
                        <h2 class="h5 fw-bold mb-4 d-flex align-items-center gap-2" style="color: #14532d;">
                            <i class="bi bi-person-vcard" style="color: #14532d;"></i> Contacts & User Manager
                        </h2>



                        <!-- Search Users Section -->
                        <div class="section-card p-4 rounded-4 border mb-4">
                            <label for="searchUsersText" class="form-label form-label-contrast small text-uppercase">Search Users</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                                <input type="text" id="searchUsersText" class="form-control" placeholder="Type a contact field to search by" onkeyup="if(event.key === 'Enter') searchUsers();" />
                                <button type="button" id="searchUsersButton" class="buttons btn btn-success px-4 fw-semibold" onclick="searchUsers();">
                                    Search Users
                                </button>
                            </div>
                            <div class="mt-3">
                                <p id="userList" class="mt-2 mb-0 d-flex flex-wrap gap-2"></p>
                            </div>
                        </div>

                        <!-- Create Contact Section -->
                        <div class="section-card p-4 rounded-4 border">
                            <label class="form-label form-label-contrast small text-uppercase mb-3">
                                Create New Contact
                            </label>

                            <div class="row g-3">

                                <!-- First Name -->
                                <div class="mb-4">
                                    <label for="firstName" class="form-label form-label-contrast small">First Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-badge text-secondary-contrast"></i></span>
                                        <input type="text" id="firstName" class="form-control" placeholder="Enter first name" required />
                                    </div>
                                </div>




                                <!-- Last Name -->
                                <div class="mb-4">
                                    <label for="lastName" class="form-label form-label-contrast small">Last Name</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-badge-fill text-secondary-contrast"></i></span>
                                        <input type="text" id="lastName" class="form-control" placeholder="Enter last name" required />
                                    </div>
                                </div>


                                <!-- Phone Number -->
                                <div class="mb-4">
                                    <label for="phoneNumber" class="form-label form-label-contrast small">Phone Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-telephone text-secondary-contrast"></i></span>
                                        <input type="text" id="phoneNum" class="form-control" placeholder="Enter phone number" required />
                                    </div>
                                </div>


                                <!-- Email Address -->
                                <div class="mb-4">
                                    <label for="emailAdd" class="form-label form-label-contrast small">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope-at text-secondary-contrast"></i></span>
                                        <input type="text" id="emailAdd" class="form-control" placeholder="Enter email" required />
                                    </div>
                                </div>




                                <!-- Add Contact Button -->
                                <div class="col-12">
                                    <button type="button" id="createContactButton" class="buttons btn btn-success px-4 fw-semibold w-100" onclick="addContact();">
                                        <i class="bi bi-person-add me-2"></i>
                                        Add Contact
                                    </button>
                                </div>
                            </div>

                            <div class="mt-3 text-start">
                                <span id="contactAddResult" class="small fw-semibold"></span>
                            </div>
                        </div>





                        <!-- Search Contacts Section -->
                        <div class="section-card p-4 rounded-4 border mb-4">
                            <label for="searchText" class="form-label form-label-contrast small text-uppercase">Search Contacts</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search text-secondary-contrast"></i></span>
                                <input type="text" id="searchText" class="form-control" placeholder="Type a contact field to search by" onkeyup="if(event.key === 'Enter') searchContacts();" />
                                <button type="button" id="searchContactsButton" class="buttons btn btn-success px-4 fw-semibold" onclick="searchContacts();">
                                    Search Contacts
                                </button>
                            </div>
                            <div class="mt-3">
                                <p id="contactList" class="mt-2 mb-0 d-flex flex-wrap gap-2"></p>
                            </div>
                        </div>



                        <!-- Update Contact Section -->
                        <div class="section-card p-4 rounded-4 border">
                            <label class="form-label form-label-contrast small text-uppercase mb-3">
                                Update Contact
                            </label>

                            <div class="row g-3">

                                <!-- Contact ID-->
                                <div class="col-md-6">
                                    <label for="contactID" class="form-label" style="color: #14532d;">Contact ID</label>
                                    <input type="text" id="contactID" class="form-control" placeholder="Enter contact ID" required />
                                </div>

                                <!-- First Name -->
                                <div class="col-md-6">
                                    <label for="firstNameUpdate" class="form-label" style="color: #14532d;">First Name</label>
                                    <input type="text" id="firstNameUpdate" class="form-control" placeholder="Enter first name" required />
                                </div>

                                <!-- Last Name -->
                                <div class="col-md-6">
                                    <label for="lastNameUpdate" class="form-label" style="color: #14532d;">Last Name</label>
                                    <input type="text" id="lastNameUpdate" class="form-control" placeholder="Enter last name" required />
                                </div>


                                <!-- Phone Number-->
                                <div class="col-md-6">
                                    <label for="phoneNumUpdate" class="form-label" style="color: #14532d;">Phone Number</label>
                                    <input type="text" id="phoneNumUpdate" class="form-control" placeholder="Enter phone number" required />
                                </div>


                                <!-- Email Address -->
                                <div class="col-md-6">
                                    <label for="emailAddUpdate" class="form-label" style="color: #14532d;">Email Address</label>
                                    <input type="text" id="emailAddUpdate" class="form-control" placeholder="Enter email" required />
                                </div>





                                <!-- Update Contact Button -->
                                <div class="col-12">
                                    <button type="button" id="updateContactButton" class="buttons btn btn-success px-4 fw-semibold w-100" onclick="updateContact();">
                                        <i class="bi bi-person-fill-up me-2"></i>
                                        Update Contact
                                    </button>
                                </div>
                            </div>

                            <div class="mt-3 text-start">
                                <span id="contactUpdateResult" class="small fw-semibold"></span>
                            </div>
                        </div>



                    </div>
                </div>

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="background-glow"></div>

    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">

                <!-- Welcome Header -->
                <div class="text-center mb-4">
                    <h1 class="fw-bold tracking-tight">Welcome</h1>
                    <p class="text-secondary-contrast">
                        Please log in or create a new account
                    </p>
                </div>

                <!-- Login/Register Card -->
                <div class="card glass-card shadow-lg border-0 p-4 p-sm-5">
                    <div class="card-body p-0">

                        <div class="d-grid gap-3">

                            <!-- Login Button -->  
                            <a href="SignIn.html"
                               class="buttons btn btn-primary w-100 py-3 fw-semibold rounded-3 shadow-sm">
                                Log In
                            </a>

                            <!-- Register Button -->
                            <a href="SignUp.html"
                               class="buttons btn btn-outline-light w-100 py-3 fw-semibold rounded-3">
                                Register
                            </a>

                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
